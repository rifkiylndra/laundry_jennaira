<script>
        function switchSegment(type) {
            const indicator = document.getElementById('segment-indicator');
            const buttons = document.querySelectorAll('.bg-surface-container-low button');
            
            if (type === 'out') {
                indicator.style.left = 'calc(50% - 0px)';
                buttons[0].classList.replace('font-bold', 'font-medium');
                buttons[0].classList.replace('text-income-green', 'text-text-secondary');
                buttons[1].classList.replace('text-text-secondary', 'text-expense-red');
                buttons[1].classList.add('font-bold');
            } else {
                indicator.style.left = '4px';
                buttons[0].classList.replace('text-text-secondary', 'text-income-green');
                buttons[0].classList.add('font-bold');
                buttons[1].classList.replace('font-bold', 'font-medium');
                buttons[1].classList.replace('text-expense-red', 'text-text-secondary');
            }
        }

        function selectCategory(element) {
            document.querySelectorAll('.category-card').forEach(card => {
                card.classList.remove('selected', 'bg-surface-container-low', 'border-primary-container');
            });
            element.classList.add('selected', 'bg-surface-container-low');
        }

        // Simple modal interactions
        const backdrop = document.getElementById('modal-backdrop');
        const modal = document.getElementById('transaction-modal');

        function closeModal() {
            modal.style.transform = 'translateY(100%)';
            backdrop.style.opacity = '0';
            setTimeout(() => {
                backdrop.style.display = 'none';
            }, 300);
        }

        backdrop.addEventListener('click', closeModal);
    </script>
