<h1 class="font-headline-lg text-headline-lg text-text-primary mb-1">Selamat Datang</h1>
<p class="font-body-lg text-body-lg text-text-secondary">Silakan masuk ke akun Anda</p>
</div>
<!-- Login Form -->
<form class="space-y-gutter-md" id="loginForm">
<!-- Email Field -->
<div class="relative input-group">
<input class="block w-full h-14 px-4 py-3 bg-transparent border border-outline rounded-lg text-text-primary focus:ring-1 focus:ring-secondary focus:border-secondary transition-all outline-none" id="email" placeholder=" " required="" type="email"/>
<label class="floating-label absolute left-4 top-4 font-label-lg text-text-secondary origin-top-left" for="email">
                    Email
                </label>
</div>
<!-- Password Field -->
<div class="relative input-group">
<input class="block w-full h-14 px-4 py-3 bg-transparent border border-outline rounded-lg text-text-primary focus:ring-1 focus:ring-secondary focus:border-secondary transition-all outline-none" id="password" placeholder=" " required="" type="password"/>
<label class="floating-label absolute left-4 top-4 font-label-lg text-text-secondary origin-top-left" for="password">
                    Password
                </label>
<button class="absolute right-4 top-4 text-text-secondary hover:text-text-primary transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="eyeIcon">visibility</span>
</button>
</div>
<!-- Actions -->
<div class="flex items-center justify-between mt-2 mb-stack-md">
<div class="flex items-center">
<input class="w-4 h-4 text-secondary-container border-outline rounded focus:ring-secondary" id="remember" type="checkbox"/>
<label class="ml-2 font-label-md text-text-secondary" for="remember">Ingat saya</label>
</div>
<a class="font-label-md text-secondary hover:underline" href="#">Lupa Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary-container text-on-primary font-title-lg text-title-lg rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">
                Login
            </button>
</form>
<!-- Footer / Register Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-md text-body-md text-text-secondary">
                Belum punya akun? 
                <a class="font-label-lg text-secondary font-bold hover:underline" href="#">Daftar Sekarang</a>
</p>
</div>
</main>
<script>
        // Micro-interactions for password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Form submission effect
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="flex items-center justify-center"><svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memproses...</span>';
            btn.disabled = true;
            
            setTimeout(() => {
                alert('Login Berhasil!');
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }, 1500);
        });
    </script>
</body></html>
