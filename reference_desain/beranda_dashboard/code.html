<script>
        // Simple animation for bar items on load
        document.addEventListener('DOMContentLoaded', () => {
            const bars = document.querySelectorAll('.bar-item');
            bars.forEach(bar => {
                const height = bar.style.height;
                bar.style.height = '0';
                setTimeout(() => {
                    bar.style.height = height;
                }, 100);
            });
        });
    </script>
