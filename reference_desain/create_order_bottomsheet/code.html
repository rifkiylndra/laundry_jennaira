<!DOCTYPE html>

<html class="light" lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Order Baru - Laundry Jennaira</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scrim {
            background-color: rgba(0, 0, 0, 0.4);
        }
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }
        input:focus ~ label,
        input:not(:placeholder-shown) ~ label {
            transform: translateY(-1.5rem) scale(0.85);
            color: #2563EB;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c4c6d0",
                    "on-secondary-fixed": "#00174b",
                    "on-primary-fixed": "#001a42",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#eff1f3",
                    "on-tertiary": "#ffffff",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#aec6ff",
                    "error": "#ba1a1a",
                    "primary-fixed-dim": "#aec6ff",
                    "text-secondary": "#64748B",
                    "surface-variant": "#e0e3e5",
                    "secondary-fixed-dim": "#b4c5ff",
                    "tertiary-fixed-dim": "#8bd79b",
                    "on-surface": "#191c1e",
                    "on-secondary-fixed-variant": "#003ea8",
                    "warning-orange": "#9A3412",
                    "on-background": "#191c1e",
                    "background": "#f7f9fb",
                    "primary": "#00183f",
                    "surface-container-low": "#f2f4f6",
                    "text-primary": "#374151",
                    "tertiary": "#001f0a",
                    "tertiary-fixed": "#a6f4b5",
                    "surface-container-high": "#e6e8ea",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f7f9fb",
                    "tertiary-container": "#003717",
                    "surface": "#f7f9fb",
                    "inverse-surface": "#2d3133",
                    "surface-card": "#FFFFFF",
                    "outline": "#747780",
                    "primary-fixed": "#d8e2ff",
                    "on-secondary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "surface-tint": "#455e91",
                    "surface-container": "#eceef0",
                    "secondary-fixed": "#dbe1ff",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#e0e3e5",
                    "secondary": "#0051d5",
                    "on-primary-fixed-variant": "#2c4678",
                    "on-tertiary-fixed-variant": "#005226",
                    "on-surface-variant": "#44474f",
                    "on-primary-container": "#7d96cd",
                    "income-green": "#166534",
                    "secondary-container": "#316bf3",
                    "on-secondary-container": "#fefcff",
                    "surface-dim": "#d8dadc",
                    "expense-red": "#991B1B",
                    "on-tertiary-fixed": "#00210b",
                    "primary-container": "#0f2d5e",
                    "on-tertiary-container": "#5ba66d"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "edge-margin": "1rem",
                    "stack-lg": "1.5rem",
                    "stack-md": "1rem",
                    "gutter-md": "1rem",
                    "stack-sm": "0.5rem"
            },
            "fontFamily": {
                    "headline-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "label-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "title-lg": ["Inter"],
                    "numeric-display": ["Inter"]
            },
            "fontSize": {
                    "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "title-lg": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                    "numeric-display": ["32px", {"lineHeight": "40px", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body-md text-on-surface min-h-screen relative overflow-hidden">
<!-- Background Content (Dashboard Placeholder) -->
<div class="p-edge-margin space-y-stack-lg blur-sm pointer-events-none">
<header class="flex items-center justify-between">
<h1 class="font-headline-md text-headline-md text-primary">Dashboard</h1>
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary-container">person</span>
</div>
</header>
<div class="grid grid-cols-2 gap-gutter-md">
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-sm border border-outline-variant/30">
<p class="text-text-secondary font-label-md">Total Pendapatan</p>
<p class="font-title-lg text-title-lg text-income-green mt-1">Rp 12.500.000</p>
</div>
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-sm border border-outline-variant/30">
<p class="text-text-secondary font-label-md">Order Hari Ini</p>
<p class="font-title-lg text-title-lg text-primary mt-1">45 Order</p>
</div>
</div>
<div class="space-y-stack-md">
<h2 class="font-title-lg text-title-lg">Order Terbaru</h2>
<div class="bg-surface-container-lowest p-stack-md rounded-xl shadow-sm border border-outline-variant/30 flex justify-between items-center">
<div>
<p class="font-label-lg text-label-lg">Budi Santoso</p>
<p class="text-text-secondary font-label-md">Express • 3.5kg</p>
</div>
<div class="px-3 py-1 bg-tertiary-container/10 text-on-tertiary-container rounded-full font-label-md">
                    Proses
                </div>
</div>
</div>
</div>
<!-- Scrim -->
<div class="scrim fixed inset-0 z-40 opacity-100 transition-opacity duration-300" id="scrim"></div>
<!-- Modal Bottom Sheet -->
<div class="bottom-sheet fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest rounded-t-3xl shadow-2xl flex flex-col max-h-[839px] open" id="orderSheet">
<!-- Handle -->
<div class="w-full flex justify-center pt-3 pb-2">
<div class="w-8 h-1 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<div class="px-edge-margin py-stack-sm flex items-center justify-between border-b border-outline-variant/20">
<h2 class="font-headline-md text-headline-md text-primary">Order Baru</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors" onclick="closeSheet()">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="px-edge-margin py-stack-lg space-y-6 overflow-y-auto">
<!-- Customer Name -->
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-1 border border-outline rounded-lg text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none bg-transparent transition-all" id="customer_name" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 text-text-secondary font-body-md transition-all pointer-events-none origin-left" for="customer_name">Nama Pelanggan</label>
</div>
<!-- Phone Number -->
<div class="relative">
<input class="peer w-full h-14 px-4 pt-4 pb-1 border border-outline rounded-lg text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none bg-transparent transition-all" id="phone_number" placeholder=" " type="tel"/>
<label class="absolute left-4 top-4 text-text-secondary font-body-md transition-all pointer-events-none origin-left" for="phone_number">Nomor Telepon</label>
</div>
<!-- Weight Input -->
<div class="relative">
<div class="flex items-center">
<input class="peer w-full h-14 px-4 pt-4 pb-1 border border-outline rounded-lg text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary outline-none bg-transparent transition-all" id="weight" placeholder=" " step="0.1" type="number"/>
<label class="absolute left-4 top-4 text-text-secondary font-body-md transition-all pointer-events-none origin-left" for="weight">Berat (kg)</label>
<span class="absolute right-4 top-4 text-text-secondary font-label-lg">kg</span>
</div>
</div>
<!-- Service Type Chips -->
<div class="space-y-stack-sm">
<label class="text-text-secondary font-label-lg px-1">Jenis Layanan</label>
<div class="flex flex-wrap gap-2">
<button class="service-chip px-5 py-2 rounded-full border border-outline text-on-surface-variant font-label-lg hover:bg-secondary-container/10 transition-colors active:scale-95" onclick="selectService(this, 7000)">
                        Kiloan
                    </button>
<button class="service-chip px-5 py-2 rounded-full border border-outline text-on-surface-variant font-label-lg hover:bg-secondary-container/10 transition-colors active:scale-95" onclick="selectService(this, 15000)">
                        Satuan
                    </button>
<button class="service-chip px-5 py-2 rounded-full border border-outline text-on-surface-variant font-label-lg hover:bg-secondary-container/10 transition-colors active:scale-95" onclick="selectService(this, 5000)">
                        Setrika
                    </button>
<button class="service-chip px-5 py-2 rounded-full border border-outline text-on-surface-variant font-label-lg hover:bg-secondary-container/10 transition-colors active:scale-95" onclick="selectService(this, 12000)">
                        Express
                    </button>
</div>
</div>
<!-- Extra Options Card -->
<div class="bg-surface-container p-stack-md rounded-xl flex items-center justify-between border border-outline-variant/30 shadow-sm">
<div class="flex items-center gap-stack-md">
<span class="material-symbols-outlined text-secondary">local_shipping</span>
<div>
<p class="font-label-lg text-label-lg">Antar Jemput</p>
<p class="text-text-secondary text-[11px]">+ Rp 5.000</p>
</div>
</div>
<input class="w-5 h-5 rounded border-outline text-secondary focus:ring-secondary transition-all" id="delivery" onchange="updateTotal()" type="checkbox"/>
</div>
</div>
<!-- Footer Action -->
<div class="p-edge-margin bg-surface-container-lowest border-t border-outline-variant/10 shadow-[0_-4px_12px_rgba(0,0,0,0.03)] pb-safe-offset">
<div class="flex items-end justify-between mb-4 px-1">
<span class="text-text-secondary font-label-lg">Total Estimasi</span>
<span class="font-numeric-display text-numeric-display text-primary" id="total_price">Rp 0</span>
</div>
<button class="w-full h-14 bg-primary-container text-on-primary font-title-lg rounded-full shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="submitOrder()">
<span class="material-symbols-outlined">save</span>
                Simpan Order
            </button>
</div>
</div>
<!-- Success Toast (Hidden by default) -->
<div class="fixed top-12 left-1/2 -translate-x-1/2 z-[100] bg-inverse-surface text-inverse-on-surface px-6 py-3 rounded-full shadow-xl flex items-center gap-3 translate-y-[-100px] transition-transform duration-500" id="toast">
<span class="material-symbols-outlined text-tertiary-fixed">check_circle</span>
<span class="font-label-lg">Order berhasil disimpan!</span>
</div>
<script>
        let selectedRate = 0;
        const weightInput = document.getElementById('weight');
        const deliveryCheckbox = document.getElementById('delivery');
        const totalPriceEl = document.getElementById('total_price');

        function selectService(el, rate) {
            // Reset others
            document.querySelectorAll('.service-chip').forEach(chip => {
                chip.classList.remove('bg-secondary-container', 'text-on-secondary-container', 'border-secondary-container');
                chip.classList.add('border-outline', 'text-on-surface-variant');
            });

            // Set active
            el.classList.add('bg-secondary-container', 'text-on-secondary-container', 'border-secondary-container');
            el.classList.remove('border-outline', 'text-on-surface-variant');
            
            selectedRate = rate;
            updateTotal();
        }

        function updateTotal() {
            const weight = parseFloat(weightInput.value) || 0;
            let total = weight * selectedRate;
            if (deliveryCheckbox.checked) total += 5000;
            
            totalPriceEl.innerText = `Rp ${total.toLocaleString('id-ID')}`;
            
            // Animation effect on change
            totalPriceEl.classList.remove('scale-110');
            void totalPriceEl.offsetWidth; // trigger reflow
            totalPriceEl.classList.add('transition-transform', 'duration-150', 'scale-110');
            setTimeout(() => totalPriceEl.classList.remove('scale-110'), 150);
        }

        weightInput.addEventListener('input', updateTotal);

        function closeSheet() {
            const sheet = document.getElementById('orderSheet');
            const scrim = document.getElementById('scrim');
            sheet.classList.remove('open');
            scrim.classList.replace('opacity-100', 'opacity-0');
            setTimeout(() => {
                scrim.style.display = 'none';
            }, 300);
        }

        function submitOrder() {
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Memproses...';
            
            setTimeout(() => {
                closeSheet();
                const toast = document.getElementById('toast');
                toast.classList.replace('translate-y-[-100px]', 'translate-y-0');
                setTimeout(() => {
                    toast.classList.replace('translate-y-0', 'translate-y-[-100px]');
                }, 3000);
            }, 1000);
        }

        // Initialize with first service selected
        window.onload = () => {
            selectService(document.querySelectorAll('.service-chip')[0], 7000);
        };
    </script>
</body></html>
