<script>
        // Micro-interaction for feedback on buttons
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                // Vibrate for mobile if supported
                if (window.navigator.vibrate) {
                    window.navigator.vibrate(10);
                }
            });
        });

        // Simple scroll hiding for FAB to prioritize reading (Optional luxury effect)
        let lastScroll = 0;
        const fab = document.querySelector('.fixed.bottom-24');
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            if (currentScroll > lastScroll && currentScroll > 100) {
                fab.classList.add('translate-y-32', 'opacity-0');
                fab.classList.remove('translate-y-0', 'opacity-100');
            } else {
                fab.classList.remove('translate-y-32', 'opacity-0');
                fab.classList.add('translate-y-0', 'opacity-100');
            }
            fab.style.transition = 'all 0.3s ease';
            lastScroll = currentScroll;
        });
    </script>
